openapi: 3.0.1
info:
  title: TraceX API
  description: TraceX backend API docs
  contact: {}
  version: "1.0"
servers:
- url: /
paths:
  /v1/auth/:
    get:
      tags:
      - Auth
      summary: Generate Authorization URL
      description: Generates the authorization URL for OAuth flow
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/dto.AuthURLResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
  /v1/auth/login:
    post:
      tags:
      - Auth
      summary: User login
      description: Logs in a user using credentials
      requestBody:
        description: Login credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.LoginRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/dto.TokenResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
      x-codegen-request-body-name: login
  /v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout user
      description: Logs out the current user and revokes their token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.SuccessResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
      security:
      - BearerAuth: []
  /v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh token
      description: Refresh JWT using refresh token
      requestBody:
        description: Refresh token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.RefreshRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/dto.TokenResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
      x-codegen-request-body-name: refresh
  /v1/projects:
    get:
      tags:
      - Projects
      summary: Get all projects
      description: Retrieve all projects owned by the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/dto.ProjectResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
      security:
      - BearerAuth: []
    post:
      tags:
      - Projects
      summary: Create new project
      description: Create a new project owned by the authenticated user
      requestBody:
        description: Create Project Payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.CreateProjectRequest'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/dto.ProjectResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
      security:
      - BearerAuth: []
      x-codegen-request-body-name: request
  /v1/projects/{id}:
    get:
      tags:
      - Projects
      summary: Get project by ID
      description: Retrieve a project by ID owned by the authenticated user
      parameters:
      - name: id
        in: path
        description: Project ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/dto.ProjectResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
      security:
      - BearerAuth: []
    delete:
      tags:
      - Projects
      summary: Delete a project
      description: Delete a project owned by the authenticated user by project ID
      parameters:
      - name: id
        in: path
        description: Project ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.SuccessResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
      security:
      - BearerAuth: []
  /v1/users/profile:
    get:
      tags:
      - Users
      summary: Get user profile
      description: Retrieve the authenticated user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response.SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/dto.UserResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.FailedResponse'
      security:
      - BearerAuth.: []
components:
  schemas:
    dto.AuthURLResponse:
      type: object
      properties:
        url:
          type: string
          description: "required: true"
          example: https://accounts.google.com/o/oauth2/auth?client_id=...
    dto.CreateProjectRequest:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          example: My Awesome Project
    dto.LoginRequest:
      required:
      - code
      - state
      type: object
      properties:
        code:
          type: string
          example: 4/0AY0e-g6VnZx...
        state:
          type: string
          example: xyz123
    dto.ProjectResponse:
      type: object
      properties:
        id:
          type: string
          description: "required: true"
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: "required: true"
          example: My Awesome Project
    dto.RefreshRequest:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
          example: def50200a4b...
    dto.TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "required: true"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: "required: true"
          example: def50200a4b...
    dto.UserResponse:
      type: object
      properties:
        createdAt:
          type: string
          description: "required: true"
          example: 2023-05-01T15:04:05Z07:00
        email:
          type: string
          description: "required: true"
          example: john.doe@example.com
        firstname:
          type: string
          description: "required: true"
          example: John
        id:
          type: string
          description: "required: true"
          example: 123e4567-e89b-12d3-a456-426614174000
        lastname:
          type: string
          description: "required: true"
          example: Doe
        picture:
          type: string
          description: "required: true"
          example: https://example.com/avatar.jpg
        role:
          type: object
          description: "required: true"
          example: admin
          allOf:
          - $ref: '#/components/schemas/entities.Role'
        updatedAt:
          type: string
          description: "required: true"
          example: 2023-05-02T10:00:00Z07:00
    entities.Role:
      type: string
      enum:
      - admin
      - user
      x-enum-varnames:
      - RoleAdmin
      - RoleUser
    response.FailedResponse:
      type: object
      properties:
        code:
          type: integer
        error:
          type: string
        message:
          type: string
    response.SuccessResponse:
      type: object
      properties:
        code:
          type: integer
        data:
          type: object
        message:
          type: string
  securitySchemes:
    BearerAuth:
      type: apiKey
      description: Type "Bearer" followed by a space and your token.
      name: Authorization
      in: header
x-original-swagger-version: "2.0"
